# Single-VM deployment: api + worker + web + Caddy (automatic HTTPS), all
# on one Docker network, SQLite/caches/checkpoints on one shared volume.
# See DEPLOY.md for the full walkthrough (Oracle VM provisioning, first
# deploy, and the redeploy command that structurally fixes the
# worker-restart-forgetting problem this session hit twice: `docker
# compose up -d --build` always restarts every service together, so a
# code change can never silently keep running against a stale worker).

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  # The image's own ENTRYPOINT is ["tradingagents"] (the CLI) -- cleared
  # here so `command:` below runs directly instead of being passed to it
  # as CLI arguments.
  entrypoint: []
  env_file:
    - .env.production
  volumes:
    # api.db (SQLite), OHLCV/news/fundamentals caches, snapshot cache,
    # LangGraph checkpoints -- everything api/db.py and
    # tradingagents/dataflows write to ~/.tradingagents. Shared between
    # api and worker so both see the same runs table and caches; a named
    # volume (not a bind mount) so it survives `docker compose down`
    # without depending on a host path.
    - tradingagents_data:/home/appuser/.tradingagents
  restart: unless-stopped

services:
  api:
    <<: *backend
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Not published to the host: Caddy is the only thing that talks to
    # this container from outside the compose network (see Caddyfile).
    expose:
      - "8000"
    # /health reports dependency status without failing when Postgres and
    # Redis are absent (api/routers/health.py), so it is a true liveness
    # probe for this SQLite-backed deployment rather than a readiness gate
    # that would never pass. Python, not curl: the slim base image has no
    # curl and adding one just for this is a wasted layer.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      # Generous: the first request imports langchain/langgraph/pandas,
      # which is slow on a shared-core free-tier VM. Too short a period
      # here restarts a container that was only ever still booting.
      start_period: 90s

  worker:
    <<: *backend
    # api.worker polls the run queue and executes analyses -- the one
    # process where every LLM/data-vendor call actually happens. A crash
    # here (see restart: unless-stopped above) resumes via
    # checkpoint_enabled (tradingagents/default_config.py) rather than
    # losing whatever was in flight.
    command: ["python", "-m", "api.worker"]

  web:
    build:
      context: ./web/app
      dockerfile: Dockerfile
      args:
        # Baked into the client JS bundle at build time (see
        # web/app/Dockerfile's own comment) -- must match DOMAIN's public
        # /backend/ path (Caddyfile), not the api service's internal
        # address, since the BROWSER calls this directly for every fetch
        # except the SSE stream proxy.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    env_file:
      - ./web/app/.env.production
    environment:
      # Server-side only (RSC, the SSE proxy route handler) -- the
      # in-network service name, not the public URL, so this never
      # leaves the Docker network or pays for a TLS round-trip to reach
      # itself.
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Read by the Caddyfile below. Set this in .env.production (not
      # .env.production.example) to your real domain, or an sslip.io
      # address (see DEPLOY.md) if you don't have one yet -- Let's
      # Encrypt's automatic HTTPS needs a real, resolvable domain either
      # way; it cannot issue a certificate for a bare IP.
      DOMAIN: ${DOMAIN}
    env_file:
      - .env.production
    depends_on:
      - web
      - api
    restart: unless-stopped

# No `ollama` service. The original compose file carried one behind a
# profile; it is deliberately absent here. This stack targets a single
# free-tier VM using a hosted LLM API (DeepSeek), where a local model
# would contend for the same 24GB and could not run anything useful at
# a size worth having. Re-add it behind `profiles: [ollama]` if you ever
# want local inference on a bigger box.
volumes:
  tradingagents_data:
  caddy_data:
  caddy_config:
